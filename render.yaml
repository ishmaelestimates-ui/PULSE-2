services:
  - type: web
    name: pulse-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: pulse-db
          property: connectionString
      - key: ENVIRONMENT
        value: production
      - key: MEDIA_STORAGE_PATH
        value: /app/media
      - key: CORS_ORIGINS
        value: https://ishmaelestimates-ui.github.io
      - key: SECRET_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false

  - type: web
    name: pulse-frontend
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://pulse-2-i2yf.onrender.com

databases:
  - name: pulse-db
    plan: free
